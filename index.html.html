<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="icon" href="logo.png"><meta property="og:title" content="Claoriex
    ">
<meta property="og:image" content="preview.png">
<meta property="og:description" content="أفضل حاسبة سعرات ومغذيات">

<meta charset="UTF-8">
<meta name="description" content="حاسبة سعرات و لياقة بدنية احترافية">
<title>CalorieX</title>
<style>
body{
  font-family:Arial;
  background:url('background.jpg') center/cover no-repeat fixed;
  color:#fff;
  margin:0;
  padding:20px;
}
.card{max-width:1000px;margin:auto;background:#1e293b;padding:20px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,button{padding:12px;border-radius:10px;border:none}
button{background:#38bdf8;cursor:pointer;font-weight:bold}
.result{margin-top:15px;background:#334155;padding:15px;border-radius:12px}
</style>
</head><link rel="icon" href="logo.png"><meta property="og:title" content="Claoriex
    ">
<meta property="og:image" content="preview.png">
<meta property="og:description" content="أفضل حاسبة سعرات ومغذيات">


<body>
<div class="card">
<h1>🏆 CalorieX</h1>

<div class="grid">
<input id="age" type="number" placeholder="العمر">
<input id="weight" type="number" placeholder="الوزن كجم">
<input id="height" type="number" placeholder="الطول سم">

<select id="gender">
<option value="male">ذكر</option>
<option value="female">أنثى</option>
</select>

<select id="steps">
<option value="1.2">أقل من 3000 خطوة</option>
<option value="1.3">3000-5000 خطوة</option>
<option value="1.45">5000-8000 خطوة</option>
<option value="1.6">8000-12000 خطوة</option>
<option value="1.75">أكثر من 12000 خطوة</option>
</select>

<select id="training">
<option value="0">بدون تمرين</option>
<option value="0.05">1-2 أيام</option>
<option value="0.10">3-4 أيام</option>
<option value="0.15">5-6 أيام</option>
<option value="0.20">7 أيام</option>
</select>

<select id="goal">
<option value="maintain">ثبات</option>
<option value="cut">تنشيف</option>
<option value="bulk">تضخيم</option>
</select>

<select id="proteinLevel">
<option value="1.6">1.6</option>
<option value="1.7">1.7</option>
<option value="1.8">1.8</option>
<option value="1.9">1.9</option>
<option value="2.0" selected>2.0</option>
<option value="2.2">2.2</option>
</select>
</div>

<br>
<button onclick="calc()">تحليل كامل</button>

<div id="out" class="result">أدخل البيانات واضغط تحليل كامل</div>
</div>

<script>
function calc(){
const age=Number(document.getElementById('age').value);
const weight=Number(document.getElementById('weight').value);
const height=Number(document.getElementById('height').value);
const gender=document.getElementById('gender').value;
const steps=Number(document.getElementById('steps').value);
const training=Number(document.getElementById('training').value);
const goal=document.getElementById('goal').value;
const proteinLevel=Number(document.getElementById('proteinLevel').value);
const out=document.getElementById('out');

if(age<=0||weight<=0||height<=0){
out.innerHTML='يرجى إدخال العمر والوزن والطول بشكل صحيح';
return;
}

const male=gender==='male';
const activity=steps+training;

const bmr=male?(10*weight+6.25*height-5*age+5):(10*weight+6.25*height-5*age-161);
const tdee=Math.round(bmr*activity);

let calories=tdee;
if(goal==='cut') calories=tdee-500;
if(goal==='bulk') calories=tdee+300;

const bmi=weight/((height/100)**2);
const protein=Math.round(weight*proteinLevel);
const fats=Math.round(weight*0.8);
const carbs=Math.max(0,Math.round((calories-(protein*4+fats*9))/4));

out.innerHTML=`
<h3>النتائج</h3>
<p>BMR: <b>${Math.round(bmr)}</b></p>
<p>TDEE: <b>${tdee}</b></p>
<p>Calories: <b>${calories}</b></p>
<p>BMI: <b>${bmi.toFixed(1)}</b></p>
<p>Protein: <b>${protein} g</b></p>
<p>Fats: <b>${fats} g</b></p>
<p>Carbs: <b>${carbs} g</b></p>
`;
}
</script>
</body>
</html>
